# Loreweaver web — browser client + server in one container.
#
# The engine is mounted as the BuildKit context `engine` (default: the source
# repo ~/repos/loreweaver), so the image always contains the repo's `--web`
# mode. Override with ENGINE_CONTEXT if the repo lives elsewhere. The engine
# code inside the image comes ONLY from the source repo — never from a
# deploy-side checkout.
#   docker compose up --build
#
# Point the model at a provider via environment variables (see the engine's
# `.env.example`): TRPG_LLM__PROVIDER / TRPG_LLM__API_KEY / TRPG_LLM__CHAT_MODEL.
# Without one, the offline demo Keeper serves the sample adventure.

services:
  loreweaver-web:
    build:
      context: .
      additional_contexts:
        # Engine source: always the source repo, not a deploy-side checkout.
        # Override with ENGINE_CONTEXT if the repo lives elsewhere.
        engine: ${ENGINE_CONTEXT:-/home/melon/repos/loreweaver}
    image: loreweaver-web:local
    # Run as the host user (default 1001:1001 — melon on the deployment VPS),
    # NOT root: every file the server writes into the ./data bind mount is
    # then owned by the host user, so the host can read/back it up without
    # sudo. Override via LW_UID/LW_GID if your host user differs.
    user: "${LW_UID:-1001}:${LW_GID:-1001}"
    ports:
      - "8787:8787"
    # Run BOTH transports on one SessionCore: the browser WebSocket listener
    # (with the SPA) and the Iroh p2p listener, so web players and desktop
    # (p2p) players share one live table. The stock `--web`/`--serve` modes
    # are mutually exclusive in app.py, hence the combined runner.
    command: ["python", "/srv/serve_both.py", "--host", "0.0.0.0", "--port", "8787",
              "--static-dir", "/srv/web-dist", "--keys", "/data/keys.toml"]
    volumes:
      # BIND MOUNT, not a named volume: every record — keys.toml, the campaign
      # SQLite DB, media, packs, backups — lives in a DEDICATED host directory
      # (default ~/loreweaver-data, override with LORE_DATA_DIR) and is visible
      # inside the container at /data. Operations then happen on the host
      # directly (scp a module in, back up the dir, read keys) with no
      # `docker exec` needed. Data is deliberately NOT in the repo checkout.
      - ${LORE_DATA_DIR:-/home/melon/loreweaver-data}:/data
      # The combined WS+p2p runner, read-only (it must track the engine's API,
      # so keep it next to the compose file on the host).
      - ./serve_both.py:/srv/serve_both.py:ro
    environment:
      # TUI locale of the server (en/zh).
      - LANG=C.UTF-8
      # Example provider wiring — uncomment and fill in:
      # - TRPG_LLM__PROVIDER=deepseek
      # - TRPG_LLM__API_KEY=sk-…
      # - TRPG_LLM__CHAT_MODEL=deepseek-v4-pro
    restart: unless-stopped
