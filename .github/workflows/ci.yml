name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every pushed SHA must finish its own run (milestone gating); queue, don't cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web (lint, format, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      # The i18n red line: no user-facing string may skip locales/{en,zh}.json.
      - run: bun run i18n:lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  live-connect:
    name: Cross-repo live-connect gate (web client ↔ engine --web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gate dials the engine's REAL `--web` mode (a fork feature) with the
      # REAL `loreweaver-protocol` WsClient, so the engine repo must sit at the
      # script's default sibling path ../loreweaver.
      - name: Clone the loreweaver engine repo for the live gate
        run: git clone --depth 1 https://github.com/Trouvaille0198/loreweaver.git ../loreweaver
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine's runtime dependencies
        run: pip install . && pip install sqlite-vec
        working-directory: ../loreweaver
      - name: Run the live-connect gate
        run: bash scripts/check_live_web.sh
